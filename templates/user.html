<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <title>Sweet Treats Cake Shop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
</head>
<body>

<header>
  <h1>🎂 Sweet Treats</h1>
  <p>Freshly baked. Pay easily with M-Pesa.</p>
</header>

<div class="list" id="list"></div>

<div class="bar">
  <div class="inner">
    <!-- New Cart Header -->
    <div class="cart-header">
      <div class="total">
        <span>Total</span>
        <span id="total">0 KES</span>
      </div>
      <div class="item-count" id="item-count">0 items</div>
    </div>
    
    <input id="phone" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="M-Pesa number, e.g. 0712345678" autocomplete="tel">
    
    <!-- Added Spinner & Text Wrapper -->
    <button id="pay" disabled aria-label="Pay with M-Pesa">
      <span class="spinner"></span>
      <span class="btn-text">Pay with M-Pesa</span>
    </button>
    
    <div id="msg" role="alert"></div>
  </div>
</div>

<script>var MENU = {{ menu|tojson }};</script>
<script src="{{ url_for('static', filename='js/user.js') }}"></script>
</body>
</html>
